<header class="hero" id="top">
  <canvas class="hero__canvas" id="hero-canvas" aria-hidden="true"></canvas>
  <div class="hero__inner">
    <p class="hero__eyebrow"><span class="hero__pulse" aria-hidden="true"></span>Engineering Manager · Yelp</p>
    <h1 class="hero__title">
      <span class="line"><span class="line__inner">Hello! I'm Rishabh <img class="hero__emoji" src="{{ site.baseurl }}/img/emojis/wave.png" alt="👋"></span></span>
      <span class="line"><span class="line__inner">I lead the engineers</span></span>
      <span class="line"><span class="line__inner">behind <em>Yelp's backend</em>.</span></span>
    </h1>
    <p class="hero__sub">I spent years as a backend engineer building scalable &amp; secure
    web architecture. Now I build the teams that do — and I still read the diffs.</p>
    <div class="hero__cta">
      <a class="btn btn--solid" href="#journey">Where I've been</a>
      <a class="btn btn--ghost" href="mailto:{{ site.email }}">Say hello</a>
    </div>
  </div>
  <a class="hero__scroll" href="#statement" aria-label="Scroll to content">
    <span class="hero__scroll-line" aria-hidden="true"></span>
    <span class="hero__scroll-text">Scroll</span>
  </a>
</header>
