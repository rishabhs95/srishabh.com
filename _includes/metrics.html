<section class="metrics" aria-label="Career at a glance">
  <div class="metrics__grid">
    <div class="metric reveal">
      <div class="metric__value"><span class="counter" data-target="15">0</span>+</div>
      <div class="metric__label">Engineers I've hired, coached, or promoted</div>
    </div>
    <div class="metric reveal">
      <div class="metric__value"><span class="counter" data-target="3">0</span></div>
      <div class="metric__label">Teams built from scratch</div>
    </div>
    <div class="metric reveal">
      <div class="metric__value"><span class="counter" data-target="100">0</span>M+</div>
      <div class="metric__label">Requests a day my teams keep alive</div>
    </div>
    <div class="metric reveal">
      <div class="metric__value"><span class="counter" data-target="8">0</span></div>
      <div class="metric__label">Years since my first production deploy</div>
    </div>
  </div>
</section>
